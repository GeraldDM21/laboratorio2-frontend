<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title mb-4">{{ isEdit ? 'Editar' : 'Nuevo' }} Producto</h3>

          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="producto.nombre" name="nombre" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" [(ngModel)]="producto.descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Precio</label>
              <input type="number" class="form-control" [(ngModel)]="producto.precio" name="precio" min="0" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Stock</label>
              <input type="number" class="form-control" [(ngModel)]="producto.cantidadStock" name="cantidadStock" min="0" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Categoría</label>
              <select class="form-select" [(ngModel)]="producto.categoria.id" name="categoriaId" required>
                <option [ngValue]="null">-- Seleccioná una categoría --</option>
                <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{ cat.nombre }}</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">{{ isEdit ? 'Actualizar' : 'Crear' }}</button>
              <a routerLink="/productos" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
