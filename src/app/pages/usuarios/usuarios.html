<div class="container mt-4">
  <h2 class="mb-3">Usuarios</h2>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of usuarios">
        <td>{{ user.id }}</td>
        <td>{{ user.nombre }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role?.name }}</td>
      </tr>
    </tbody>
  </table>

  <nav *ngIf="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 0">
        <button class="page-link" (click)="loadUsuarios(currentPage - 1)">Anterior</button>
      </li>
      <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index"
          [class.active]="i === currentPage">
        <button class="page-link" (click)="loadUsuarios(i)">{{ i + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages - 1">
        <button class="page-link" (click)="loadUsuarios(currentPage + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>
