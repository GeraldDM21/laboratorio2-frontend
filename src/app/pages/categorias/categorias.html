<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorías</h2>
    <a routerLink="/categorias/new" class="btn btn-primary" *ngIf="authService.isSuperAdmin()">+ Nueva Categoría</a>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categorias">
        <td>{{ cat.id }}</td>
        <td>{{ cat.nombre }}</td>
        <td>{{ cat.descripcion }}</td>
        <td>
          <ng-container *ngIf="authService.isSuperAdmin()">
            <a [routerLink]="['/categorias/edit', cat.id]" class="btn btn-sm btn-warning me-2">Editar</a>
            <button class="btn btn-sm btn-danger" (click)="delete(cat.id)">Eliminar</button>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>

  <nav *ngIf="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="loadCategorias(currentPage - 1)">Anterior</button>
      </li>
      <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index"
          [class.active]="i + 1 === currentPage">
        <button class="page-link" (click)="loadCategorias(i + 1)">{{ i + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="loadCategorias(currentPage + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>
